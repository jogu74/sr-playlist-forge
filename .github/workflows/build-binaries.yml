name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "synth_playlist_editor.py"
      - "requirements-build.txt"
      - "scripts/**"
      - ".github/workflows/build-binaries.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: SR-Playlist-Forge-macOS
            output_path: dist/SR Playlist Forge
          - os: windows-latest
            artifact_name: SR-Playlist-Forge-Windows
            output_path: dist/SR Playlist Forge.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate icons
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python scripts/generate_icons.py --mac --input icon.png
          fi
        shell: bash

      - name: Generate icons (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/generate_icons.py --windows --input icon.png

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --clean --icon "assets/icon.icns" --name "SR Playlist Forge" synth_playlist_editor.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --clean --icon "assets/icon.ico" --name "SR Playlist Forge" synth_playlist_editor.py

      - name: Zip macOS binary
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.output_path }}" "dist/SR-Playlist-Forge-macOS.zip"

      - name: Zip Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.output_path }}" -DestinationPath "dist/SR-Playlist-Forge-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
